<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temporary responsive QA</title><style>body{font:13px system-ui;background:#edf0f6;color:#123;margin:15px}.stage{display:flex;gap:15px;flex-wrap:wrap}iframe{display:block;height:750px;width:390px;border:3px solid #142b50;border-radius:12px;background:white}pre{white-space:pre-wrap;background:white;padding:13px;max-width:640px;min-width:290px;border-radius:10px;line-height:1.6}</style></head><body><h2>Responsive integrity QA</h2><div class="stage"><iframe id="site" src="./index.html?mobile-reviews-verification=1" title="Portfolio responsive test"></iframe><pre id="result">CHECKING...</pre></div><script>
(()=>{const f=document.getElementById("site"),out=document.getElementById("result"),widths=[320,360,375,390,430,600,768,1024],results=[];
const sleep=t=>new Promise(r=>setTimeout(r,t));
function check(width){const w=f.contentWindow,d=w.document,de=d.documentElement,figure=d.querySelector(".sca-leadership-image img"),cards=[...d.querySelectorAll("#recognition .review-card")],footer=d.querySelector("#recognition .review-source-footer"),head=d.querySelector(".header .brand"),util=d.querySelector(".header .header-utilities"),rect=e=>e?.getBoundingClientRect(),hdr=rect(head),u=rect(util),i=rect(figure),reviews=cards.map(rect),visibleDates=cards.some(c=>/\b(?:19|20)\d\d\b|(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)/i.test(c.innerText));
const row={width:width,inner:w.innerWidth,client:de.clientWidth,scrollWidth:de.scrollWidth,overflows:de.scrollWidth>de.clientWidth+2,
  reviewerCount:cards.length,visibleDates:visibleDates,imageComplete:!!figure?.complete&&figure.naturalWidth>0,
  imageNaturalDimensions:figure?[figure.naturalWidth,figure.naturalHeight]:null,
  imageWithinViewport:!!i&&i.left>=-3&&i.right<=w.innerWidth+3,
  cardsWithinViewport:reviews.every(x=>x&&x.left>=-3&&x.right<=w.innerWidth+3),
  sourceLinkVisible:!!d.querySelector("#recognition .review-source-footer a"),headerOverlap:!!hdr&&!!u&&hdr.right>u.left+3,
  bodyPaddingBottom:parseFloat(w.getComputedStyle(d.body).paddingBottom)};
if(width===390){const lang=d.getElementById("language-toggle");if(d.documentElement.lang!=="en")lang.click();lang.click();row.arabicLayout=de.lang==="ar"&&de.dir==="rtl";row.arabicQuotes=!!d.querySelector('#recognition .review-card .review-text.case-ar')&&w.getComputedStyle(d.querySelector('#recognition .review-card .review-text.case-ar')).display!=="none";lang.click();row.englishRestored=de.lang==="en"&&de.dir==="ltr";}
results.push(row);out.textContent=JSON.stringify(results,null,2);}
f.addEventListener("load",async()=>{try{await sleep(700);for(const width of widths){f.style.width=width+"px";await sleep(600);check(width);}out.textContent="QA_COMPLETE\n"+JSON.stringify(results,null,2);}catch(e){out.textContent="QA_ERROR:"+e.stack+"\n"+JSON.stringify(results,null,2)}} ,{once:true});
})();
</script></body></html>
